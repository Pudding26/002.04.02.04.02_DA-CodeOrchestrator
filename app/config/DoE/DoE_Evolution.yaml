Unrestricted_01:
  mutation_strategy: static
  mutation_func: 1
  control_branches:
    - Unrestricted_01_A
    - Unrestricted_01_B
    - Unrestricted_01_C
  allow_multi_mutation: true
  fallback_on_invalid: true
  max_generations: 15
  generation_size: 10
  elite_size: 5

  static_mutate_params:
    modeling.metricModelNo:
      mutate_chance: 0.05
      must_contain: ["MM02", "MM03", "MM04"]
      must_not_contain: ["ALL"]
    preprocessing.preProcessingNo:
      must_contain: ["PP04"]
      must_not_contain: ["ALL"]
    
Unrestricted_02:
  mutation_strategy: static
  mutation_func: 1
  control_branches:
    - Unrestricted_02_A
