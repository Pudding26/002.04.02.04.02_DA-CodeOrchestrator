  fallback_on_invalid: true
  max_generations: 5
  generation_size: 30
  elite_size: 5

  static_mutate_params:
    modeling.metricModelNo:
      mutate_chance: 0.05
      must_contain: ["MM02", "MM03", "MM04"]
      must_not_contain: ["ALL"]
    preprocessing.preProcessingNo:
      must_contain: ["PP04"]
      must_not_contain: ["ALL"]
  dependent_mutate_params:
    primary_data.genus:
      mutate_chance: 0.5
      growth_bias: 0.3


